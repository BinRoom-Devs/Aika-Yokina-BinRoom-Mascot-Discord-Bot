[project]
name = "aika-yokina-bot"
version = "3.3.0"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "groq>=0.4.0",
    "nicegui>=1.4.0",
    "pillow>=10.0.0",
    "resvg-py>=0.1.0",
    "matplotlib>=3.7.0",
    "qrcode>=7.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pylatexenc>=2.10"
]

[tool.ruff]
target-version = "py315"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"